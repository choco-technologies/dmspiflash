; STM32F746G-DISCO: the on-board Micron N25Q128A (128 Mbit) as a block device
; /dev/dmspiflash0 - the WHOLE chain in one file: pins (dmgpio), the QUADSPI bus
; (dmqspi) and the flash driver (dmspiflash). It lives here, with the chip
; driver, on purpose: the board needs only dmspiflash, and its dependencies
; (dmqspi, dmgpio) are imported automatically. dmqspi itself is chip-agnostic
; and ships no board configs.
;
; Pins per UM1907 (STM32F746G-DISCO user manual) and the STM32F746 datasheet
; alternate-function table - VERIFY both before first use:
;   PB2  = QUADSPI_CLK        AF9
;   PB6  = QUADSPI_BK1_NCS    AF10
;   PD11 = QUADSPI_BK1_IO0    AF9
;   PD12 = QUADSPI_BK1_IO1    AF9
;   PE2  = QUADSPI_BK1_IO2    AF9
;   PD13 = QUADSPI_BK1_IO3    AF9
; Check these pins against the other .ini files of the board (lcd, touch,
; audio, ARDUINO header) - PD11/PD13 etc. may be claimed twice.

[qspi_clk]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PB2
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none

[qspi_ncs]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PB6
mode=alternate
alternate_function=10
speed=maximum
output_circuit=push_pull
pull=up

[qspi_io0]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PD11
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none

[qspi_io1]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PD12
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none

[qspi_io2]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PE2
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none

[qspi_io3]
driver_name=dmgpio
driver_order=2
friends_group=qspi
pin=PD13
mode=alternate
alternate_function=9
speed=maximum
output_circuit=push_pull
pull=none


; The QUADSPI bus (dmqspi): node /dev/dmqspi1. Keys: dmqspi docs/configuration.md.
[qspi]
driver_name=dmqspi
driver_order=2
friends_group=qspi
friend_role=bus
instance=1
bank=1
clock_hz=50000000
flash_size=16777216
cs_high_cycles=2
clock_mode=0
sample_shift_half=1

; The flash chip driver (this module). It finds the bus node through the shared
; friends_group (the friend with friend_role=bus) and opens it on first use; or set
; bus_path=/dev/dmqspix/qspi explicitly. driver_order must be HIGHER than the bus's.
[flash]
driver_name=dmspiflash
driver_order=3
friends_group=qspi
bus=qspi
; empty = identify by JEDEC id (20 BA 18); set chip=N25Q128A to skip the check
chip=
; bus_path=
quad=1
memory_mapped=0
