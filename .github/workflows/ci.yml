name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmspiflash
        run: |
          mkdir -p build
          cd build
          # The module and its test run natively on this runner, but DMOD_CPU_FAMILY stays
          # at its default (stm32f7): the bus drivers' headers (dmqspi, dmgpio) are only
          # published per stm32 family, so a x86_64 family would 404 (same as dmsdio's CI).
          # Only the tools are switched to the host ones.
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build . --target dmspiflash test_dmspiflash

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmspiflash.dmf
          test -f build/dmf/dmspiflash_version.txt
          test -f build/dmf/test_dmspiflash.dmf
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          # Runtime dependency of dmspiflash/test_dmspiflash (see build/dmf/dmspiflash.dmd);
          # the bus drivers are headers only for the host test.
          dmf-get install dmini -y
          dmod_loader build/dmf/test_dmspiflash.dmf
